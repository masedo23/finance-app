<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline | Finance App</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(34,197,94,.15), transparent 40%),
                    linear-gradient(to bottom, #0b1d0f, #020502);
        color: white;
        padding: 16px;
    }

    .wrapper {
        width: 100%;
        max-width: 360px;
        padding: 36px 28px;
        border-radius: 20px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 16px;
        background: rgba(34,197,94,.15);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo svg {
        width: 32px;
        height: 32px;
        color: #22c55e;
    }

    h1 {
        font-size: 22px;
        font-weight: 700;
    }

    p {
        font-size: 15px;
        opacity: 0.8;
        line-height: 1.6;
    }

    button {
        width: 100%;
        padding: 14px;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        background: linear-gradient(to right, #22c55e, #16a34a);
        color: #022c22;
        transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:active {
        transform: scale(0.97);
    }

    button:hover {
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .helpdesk {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.7;
    }

    .helpdesk a {
        color: #22c55e; /* theme green */
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.2s;
    }
    .helpdesk a:hover {
        opacity: 0.8;
    }

</style>
</head>
<body>

<div class="wrapper">
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 8.82a15 15 0 0 1 20 0"/>
            <path d="M5 12.55a10 10 0 0 1 14 0"/>
            <path d="M8.5 16.27a5 5 0 0 1 7 0"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
    </div>

    <h1>Connection Lost</h1>
    <p>You are currently offline.<br>Connect to the internet to continue.</p>

    <button onclick="location.reload()">Try to Reconnect</button>

    <div class="helpdesk">
        <span>Need help? </span>
        <a href="https://wa.me/6283152643338?text=gimana%20ni%20ngab%20kok%20gk%20bsa%20dibuka%20aplikasinya%20%3F%20pdahal%20paket%20sdh%20kunyalakan" target="_blank"> Contact Helpdesk
        </a>


    </div>
</div>

</body>
</html>
